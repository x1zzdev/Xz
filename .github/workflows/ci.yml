name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LLVM_SYS_170_PREFIX: /usr/lib/llvm-17
  LIBRARY_PATH: /usr/lib/llvm-17/lib

jobs:
  check:
    name: format, lint, test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: xz-cli
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 17
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 17
          sudo apt-get install -y llvm-17-dev libllvm17

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xz-cli

      - name: Drop machine-specific cargo config
        run: rm -f .cargo/config.toml

      - name: Test
        run: cargo test
