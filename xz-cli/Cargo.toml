[package]
name = "xz-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Xz language compiler CLI (front end + LLVM backend)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/x1zzdev/Xz"
homepage = "https://github.com/x1zzdev/Xz"
authors = ["Jangseowoo (x1zz) <ax1s@x1zz.com>"]
keywords = ["language", "compiler", "llvm", "contracts"]
categories = ["compilers", "development-tools"]

[[bin]]
name = "xz"
path = "src/main.rs"

[dependencies]
inkwell = "0.10.0"
serde_json = "1"

# LLVM 17 feature selection. See .cargo/config.toml (env pinning) and
# docs/13-codegen.md for how LLVM_SYS_170_PREFIX / LIBRARY_PATH are set.
[features]
default = ["llvm17-0", "llvm17-0-prefer-dynamic"]
llvm17-0 = ["inkwell/llvm17-0"]
llvm17-0-prefer-dynamic = ["inkwell/llvm17-0-prefer-dynamic"]